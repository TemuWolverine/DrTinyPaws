name: Deploy Web Subsite to Pages

on:
  push:
    branches: ["master", "main"]
    paths:
      - "web/**"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ImageMagick
        uses: mfinelli/setup-imagemagick@v8.0.0

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips libvips-dev libvips-tools

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: './web'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Copy CHANGELOG to _includes
        run: |
          mkdir -p ./web/_includes
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md ./web/_includes/
          fi

      - name: Build with Jekyll
        working-directory: './web'
        run: bundle exec jekyll build --destination ../_site --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
